name: Publish PowerShell Module

on:
  release:
    types: [published]

jobs:
  publish-to-psgallery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set PSRepository to Trusted for PowerShell Gallery
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
      - name: Install AsBuiltReport.Core module
        shell: pwsh
        run: |
          Install-Module -Name AsBuiltReport.Core -Repository PSGallery -Force
      - name: Test Module Manifest
        shell: pwsh
        run: |
          Test-ModuleManifest .\AsBuiltReport.Ribbon.SWeEdge\AsBuiltReport.Ribbon.SWeEdge.psd1
      - name: Publish module to PowerShell Gallery
        shell: pwsh
        run: |
          Publish-Module -Path .\AsBuiltReport.Ribbon.SWeEdge -NuGetApiKey ${{ secrets.PSGALLERY_API_KEY }} -Verbose
  tweet:
    needs: publish-to-psgallery
    runs-on: ubuntu-latest
    steps:
      - uses: Eomm/why-don-t-you-tweet@v2
        if: ${{ !github.event.repository.private }}
        with:
          tweet-message: "[New Release] ${{ github.event.repository.name }} ${{ github.event.release.tag_name }}! Check out what's new! ${{ github.event.release.html_url }} #Ribbon #SWeEdge #AsBuiltReport #PowerShell"
        env:
          TWITTER_CONSUMER_API_KEY: ${{ secrets.TWITTER_CONSUMER_API_KEY }}
          TWITTER_CONSUMER_API_SECRET: ${{ secrets.TWITTER_CONSUMER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  bsky-post:
    needs: publish-to-psgallery
    runs-on: ubuntu-latest
    steps:
      - uses: zentered/bluesky-post-action@v0.2.0
        with:
          post: "[New Release] ${{ github.event.repository.name }} ${{ github.event.release.tag_name }}! Check out what's new! ${{ github.event.release.html_url }} #Ribbon #SWeEdge #AsBuiltReport #PowerShell"
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}

